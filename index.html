<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acerus IT</title>
    <!-- Скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            text-align: left;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1c1c1e;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
            color: #ffffff;
        }
        .header .subtitle {
            color: #555555;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        .task-card {
            background-color: #0a0a0b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #1c1c1e;
            transition: all 0.2s ease;
        }
        .task-card:active {
            border-color: #444444;
            background-color: #0e0e10;
        }
        .task-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .task-desc {
            font-size: 13px;
            color: #888888;
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-price {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            border: 1px solid #222222;
            padding: 6px 14px;
            border-radius: 20px;
            background-color: #0a0a0b;
        }
        .btn-take {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-take:active {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ACERUS IT</h1>
        <div class="subtitle">DEVELOPMENT TASK BOARD</div>
    </div>

    <!-- Место для автоматического вывода твоих задач -->
    <div id="tasks-list"></div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
        }

        // Твой список задач с ценами
        const tasks = [
            {
                id: 1,
                title: "DEVELOP / SIMPLE BOT",
                desc: "Создание базового асинхронного бота-визитки на Python для локального бизнеса.",
                price: "450 ₽"
            },
            {
                id: 2,
                title: "DESIGN / FIGMA BANNER",
                desc: "Разработка минималистичного оформления и паттерна с мягкими гранями.",
                price: "350 ₽"
            },
            {
                id: 3,
                title: "AI / PROMPT TEXT",
                desc: "Генерация уникальных текстов или постов для Telegram-канала с помощью нейросети.",
                price: "300 ₽"
            }
        ];

        // Функция отрисовки карточек на экране
        function renderTasks() {
            const listContainer = document.getElementById('tasks-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <div class="task-title">${task.title}</div>
                    <div class="task-desc">${task.desc}</div>
                    <div class="task-footer">
                        <div class="task-price">${task.price}</div>
                        <button class="btn-take" onclick="takeTask(${task.id})">TAKE ORDER</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Функция клика по кнопке "TAKE ORDER"
        function takeTask(id) {
            if (window.Telegram && window.Telegram.WebApp) {
                // Передаем боту строку, например: pay_1
                window.Telegram.WebApp.sendData(`pay_${id}`);
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                window.Telegram.WebApp.close();
            }
        }

        // Запуск отрисовки
        document.addEventListener('DOMContentLoaded', renderTasks);
    </script>
</body>
</html>
